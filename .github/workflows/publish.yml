name: Publish Daily Brief

on:
  schedule:
    # Every 30 minutes, at off-peak minutes: GitHub often skips jobs scheduled on the hour/half hour.
    - cron: "11,41 * * * *"
  workflow_dispatch:          # "Run workflow" button for a manual refresh
    inputs:
      ig_slot:
        description: "Post to Instagram now (am, pm or week); leave empty for no post"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write   # save headline history back to the repo
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and build the site
        run: |
          pip install -q opencv-python-headless || echo "no face detection this run"   # crops photos to faces
          python3 build.py

      - name: Render the Instagram carousel (only when a post is due)
        if: github.event_name != 'push'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_FORCE: ${{ inputs.ig_slot }}
        run: |
          if python3 tools/instagram.py due; then
            pip install -q playwright && python3 -m playwright install --with-deps chromium
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)   # for the daily Reel
            python3 tools/instagram.py prepare
          fi

      - name: Save headline history
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add data/history data/og_cache.json data/focal_cache.json data/logos data/markets_last.json data/top_stories.json
          git diff --cached --quiet || git commit -m "Update headline history [skip ci]"
          git pull --rebase --autostash && git push || echo "history push skipped"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Post to Instagram
        if: hashFiles('.ig-pending.json') != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
        run: |
          python3 tools/instagram.py post
          git add data/instagram.json
          git diff --cached --quiet || git commit -m "Instagram post [skip ci]"
          git pull --rebase --autostash && git push || echo "instagram state push skipped"
