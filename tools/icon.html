<!doctype html><html><head><meta charset="utf-8">
<!-- App icon renderer: open via `python3 tools/make_icons.py W` (letter = first argument). -->
<link rel="stylesheet" href="https://use.typekit.net/cul0plr.css">
<style>body{margin:0;background:#ddd;padding:30px}canvas{width:384px;height:384px}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script>
const letter = new URLSearchParams(location.search).get("letter") || "W";
async function draw(cv) {
  const ctx = cv.getContext("2d"), x = 100, y = 100, w = 824, r = 185;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.22)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  ctx.beginPath(); ctx.roundRect(x, y, w, w, r); ctx.fillStyle = "#f4efe7"; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, w, r); ctx.clip();
  // the header's cyanotype poppy hanging from the top, washed with cream so the letter stays crisp
  const tex = new Image();
  tex.src = "/static/header-poppy.jpg";
  await (tex.complete && tex.naturalWidth ? Promise.resolve() : new Promise((ok, fail) => { tex.onload = ok; tex.onerror = fail; }));  // decode() can stall in background tabs
  ctx.drawImage(tex, 690, 150, 860, 860, x, y, w, w);   // square crop starting inside the petals, so they fill the top edge
  // multiply by the page cream: the white backdrop becomes exactly #F4EFE7, the petals warm slightly
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "#f4efe7";
  ctx.fillRect(x, y, w, w);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(244,239,231,0.3)";   // a light wash so the letter stays crisp
  ctx.fillRect(x, y, w, w);
  ctx.restore();
  await document.fonts.load('italic 600px "kepler-std-subhead"');
  ctx.fillStyle = "#16223f";
  ctx.font = 'italic 640px "kepler-std-subhead"';
  const width = ctx.measureText(letter).width;
  if (width > 500) ctx.font = `italic ${Math.round(640 * 500 / width)}px "kepler-std-subhead"`;  // wide letters (W, M) stay inside the iPhone crop
  // center the visible ink (italics lean, so the font box isn't centered on the glyph)
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  const m = ctx.measureText(letter);
  const inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, inkH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  ctx.fillText(letter, 512 - inkW / 2 + m.actualBoundingBoxLeft, 512 - inkH / 2 + m.actualBoundingBoxAscent);
}
(async () => {
  const cv = document.getElementById("c");
  await draw(cv);
  const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
  await fetch("/save", { method: "POST", body: blob });
  document.title = "done";
})();
</script></body></html>
