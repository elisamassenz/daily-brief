<!doctype html><html><head><meta charset="utf-8">
<!-- App icon renderer: open via `python3 tools/make_icons.py W` (letter = first argument). -->
<link rel="stylesheet" href="https://use.typekit.net/cul0plr.css">
<style>body{margin:0;background:#ddd;padding:30px}canvas{width:384px;height:384px}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script>
const letter = new URLSearchParams(location.search).get("letter") || "W";
async function draw(cv) {
  const ctx = cv.getContext("2d"), x = 100, y = 100, w = 824, r = 185;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.22)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  ctx.beginPath(); ctx.roundRect(x, y, w, w, r); ctx.fillStyle = "#efebe3"; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, w, r); ctx.clip();
  // the site's blurred-flower texture, washed with bone so the letter stays crisp at small sizes
  const tex = new Image();
  tex.src = "/static/texture.jpg";
  await tex.decode();
  ctx.drawImage(tex, 420, 0, 900, 900, x, y, w, w);
  ctx.fillStyle = "rgba(239,235,227,0.38)";
  ctx.fillRect(x, y, w, w);
  ctx.restore();
  await document.fonts.load('600px "freight-big-pro"');
  ctx.fillStyle = "#1e1b18";
  ctx.font = '640px "freight-big-pro"';
  const width = ctx.measureText(letter).width;
  if (width > 500) ctx.font = `${Math.round(640 * 500 / width)}px "freight-big-pro"`;  // wide letters (W, M) stay inside the iPhone crop
  ctx.textAlign = "center";
  ctx.fillText(letter, 512, 742);
}
(async () => {
  const cv = document.getElementById("c");
  await draw(cv);
  const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
  await fetch("/save", { method: "POST", body: blob });
  document.title = "done";
})();
</script></body></html>
