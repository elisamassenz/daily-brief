<!doctype html><html><head><meta charset="utf-8">
<!-- Makes static/stem.png from tools/src/stem-original.png (AI-generated in Figma): removes the cream
     backdrop so only the flowers remain, and downsizes for the web.
     Run `python3 tools/make_icons.py --stem`, then open http://localhost:8799/tools/stem.html -->
<style>body{margin:0;background:#888}canvas{height:90vh}</style></head>
<body><canvas id="c"></canvas>
<script>
(async () => {
  const img = new Image();
  img.src = "/tools/src/stem-original.png";
  await (img.complete && img.naturalWidth ? Promise.resolve() : new Promise((ok, fail) => { img.onload = ok; img.onerror = fail; }));
  const H = 900, W = Math.round(img.naturalWidth * H / img.naturalHeight);
  const cv = document.getElementById("c");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.drawImage(img, 0, 0, W, H);
  const px = ctx.getImageData(0, 0, W, H), d = px.data;
  const bg = [242, 235, 223];   // the backdrop, sampled from the corners
  for (let i = 0; i < d.length; i += 4) {
    const dist = Math.hypot(d[i] - bg[0], d[i + 1] - bg[1], d[i + 2] - bg[2]);
    const a = Math.min(1, Math.max(0, (dist - 7) / 26));          // soft key: near-backdrop pixels fade out
    d[i + 3] = Math.round(255 * a);
  }
  ctx.putImageData(px, 0, 0);
  const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
  await fetch("/save?name=stem.png", { method: "POST", body: blob });
  document.title = "done";
})();
</script></body></html>
