<!doctype html><html><head><meta charset="utf-8">
<!-- Makes static/<name>.png from tools/src/<name>-original.png (open with ?name=stem-b etc.) (AI-generated in Figma): removes the cream
     backdrop so only the flowers remain, and downsizes for the web.
     Run `python3 tools/make_icons.py --stem`, then open http://localhost:8799/tools/stem.html -->
<style>body{margin:0;background:#888}canvas{height:90vh}</style></head>
<body><canvas id="c"></canvas>
<script>
(async () => {
  const img = new Image();
  const q = new URLSearchParams(location.search);
  const name = q.get("name") || "stem";            // stem, stem-b, stem-c ...
  img.src = `/tools/src/${name}-original.png`;
  await (img.complete && img.naturalWidth ? Promise.resolve() : new Promise((ok, fail) => { img.onload = ok; img.onerror = fail; }));
  const H = 900, W = Math.round(img.naturalWidth * H / img.naturalHeight);
  const cv = document.getElementById("c");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.drawImage(img, 0, 0, W, H);
  const px = ctx.getImageData(0, 0, W, H), d = px.data;
  // the backdrop color, averaged from the four corners
  const bg = [0, 0, 0];
  for (const [x, y] of [[4, 4], [W - 5, 4], [4, H - 5], [W - 5, H - 5]]) {
    const c = ctx.getImageData(x, y, 1, 1).data;
    for (let k = 0; k < 3; k++) bg[k] += c[k] / 4;
  }
  for (let i = 0; i < d.length; i += 4) {
    const dist = Math.hypot(d[i] - bg[0], d[i + 1] - bg[1], d[i + 2] - bg[2]);
    // soft key: near-backdrop pixels fade out, but anything brighter than the backdrop (white petals) stays solid
    const lift = (d[i] + d[i + 1] + d[i + 2]) / 3 - (bg[0] + bg[1] + bg[2]) / 3;
    const a = lift > 4 ? 1 : Math.min(1, Math.max(0, (dist - 7) / 26));
    d[i + 3] = Math.round(255 * a);
  }
  ctx.putImageData(px, 0, 0);
  const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
  await fetch(`/save?name=${name}.png`, { method: "POST", body: blob });
  document.title = "done";
})();
</script></body></html>
