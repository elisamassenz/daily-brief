<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Instagram carousel (1080×1350 slides): the top two trending stories and markets.
     tools/instagram.py opens this page in a headless browser and saves each .slide as an image.
     Open http://localhost:8787/ig.html to preview. -->
<meta name="robots" content="noindex">
<title>Wallflower slides</title>
<link rel="stylesheet" href="https://use.typekit.net/cul0plr.css">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4efe7; --card: #fff; --sage: #e6e3cf; --ink: #1e1b18; --ink-2: #4a443d; --muted: #8c857b; --rule: #e0dbd0;
  --accent: #1f4fc4; --accent-soft: #77722a; --up: #3d7a3a; --down: #b83a20;
  --sky: #dfe7f6; --pistachio: #e6e8d3; --butter: #f4ead0; --periwinkle: #e5e6f8;
  --serif: "kepler-std-subhead", "kepler-std", Georgia, serif;
  --sans: "Manrope", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: #ccc; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); margin: 0 auto 40px; display: flex; flex-direction: column; padding: 76px 84px 64px; }
.slide > * { position: relative; z-index: 1; }
.peek { position: absolute; z-index: 0; pointer-events: none; -webkit-mask-image: linear-gradient(#000 45%, transparent 72%); mask-image: linear-gradient(#000 45%, transparent 72%); }

/* the site header's cyanotype poppy, hung from the top right edge and faded out like on the site */
.poppy { position: absolute; z-index: 2;   /* over the masthead rule, so the line tucks behind the petals */
   top: -44px; left: 330px; width: 985px; aspect-ratio: 2240 / 1041; pointer-events: none;
  background: url("header-poppy.jpg") center / cover no-repeat; mix-blend-mode: multiply; opacity: .75;
  -webkit-mask-image: linear-gradient(#000 60%, transparent 70%), linear-gradient(90deg, transparent 21%, #000 28%, #000 74%, transparent 82%);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(#000 60%, transparent 70%), linear-gradient(90deg, transparent 21%, #000 28%, #000 74%, transparent 82%); mask-composite: intersect; }
.top { padding-bottom: 24px; border-bottom: 1.5px solid var(--rule); }
.brand { font-family: var(--serif); font-size: 50px; line-height: 1; }
.date { display: block; margin-top: 12px; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.eyebrow { display: flex; align-items: center; gap: 16px; margin: 52px 0 24px; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-soft); }
.num { font-size: 21px; letter-spacing: .04em; color: var(--accent); background: var(--sage); border-radius: 999px; padding: 6px 18px; }

h1 { margin: 0; font-weight: 600; font-size: 74px; line-height: 1.1; letter-spacing: -.025em; }   /* shrunk to fit 4 lines by the script */
.summary { margin: 24px 0 0; font-size: 30px; line-height: 1.42; color: var(--ink-2); }   /* trimmed to 3 lines by the script */
.meta { display: flex; align-items: center; gap: 18px; margin-top: 30px; font-size: 23px; color: var(--ink-2); }
.stack { display: inline-flex; }
.logo { width: 46px; height: 46px; border-radius: 50%; padding: 6px; background: #fff; object-fit: contain; box-shadow: 0 0 0 3px var(--bg); margin-left: -12px; }
.stack .logo:first-child { margin-left: 0; }

.coverage { margin-top: auto; border-radius: 30px; padding: 30px 36px 14px; }
.cov-label { font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.angle { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 20px 0; border-top: 1.5px solid rgba(30, 27, 24, .1); align-items: baseline; }
.angle:first-of-type { border-top: none; }
.pub { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; color: var(--ink-2); }
.pub .logo { width: 34px; height: 34px; padding: 4px; margin: 0; box-shadow: none; flex: none; }
.angle-title { font-size: 25px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 34px; font-size: 21px; color: var(--muted); letter-spacing: .02em; }
.foot b { color: var(--ink); font-weight: 600; }

/* markets */
.m-title { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 96px; line-height: 1; letter-spacing: -.015em; }
.m-dek { margin: 18px 0 0; font-size: 29px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
.tile { background: var(--card); border-radius: 26px; padding: 24px 28px 18px; }
.t-name { font-size: 20px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.t-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px; }
.t-px { font-family: var(--mono); font-size: 38px; font-weight: 500; letter-spacing: -.02em; }
.t-ch { font-family: var(--mono); font-size: 22px; }
.up { color: var(--up); } .down { color: var(--down); }
.tile svg { display: block; width: 100%; height: 70px; margin-top: 14px; }
.movers { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: auto; }
.mv { border-radius: 26px; padding: 22px 28px 10px; }
.mv h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.mv-row { display: flex; align-items: baseline; gap: 14px; padding: 12px 0; border-top: 1.5px solid rgba(30, 27, 24, .08); font-size: 22px; }
.mv-row:first-of-type { border-top: none; }
.mv-sym { font-family: var(--mono); font-weight: 500; width: 82px; flex: none; }
.mv-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.mv-pct { font-family: var(--mono); font-size: 21px; }

/* hook: the same story in each outlet's words */
.hook-title { margin: 0 0 30px; font-family: var(--serif); font-weight: 400; font-size: 88px; line-height: 1; letter-spacing: -.015em; }
.quotes, .days { margin-top: auto; }
.quote { padding: 22px 0; border-top: 1.5px solid var(--rule); }
.quote .pub { margin-bottom: 10px; }
.quote p { margin: 0; font-family: var(--serif); font-size: 40px; line-height: 1.15; }
/* sunday recap */
.day-row { display: grid; grid-template-columns: 74px 1fr auto; gap: 20px; align-items: baseline; padding: 18px 0; border-top: 1.5px solid var(--rule); }
.dow { font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-soft); }
.dh { font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
.dn { font-size: 19px; color: var(--muted); }
.dn::after { content: " outlets"; }
</style></head>
<body><main id="slides"></main>
<script>
// URL options (set by tools/instagram.py): ?mode=week for the Sunday recap; ?skip=a,b|c,d lists stories already
// posted today (each as its key words) so the evening post doesn't repeat the midday one.
(async () => {
  const opt = new URLSearchParams(location.search);
  const get = async (paths) => { for (const p of paths) { try { const r = await fetch(p); if (r.ok) return r.json(); } catch {} } return null; };
  const news = await get(["data/news.json", "api/news"]).then((j) => j?.data || j);
  const mkt = await get(["data/markets.json", "api/markets"]);
  const tops = (await get(["data/top_stories.json", "api/top_stories"])) || {};
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const SRC = Object.fromEntries(news.sources.map((s) => [s.id, s]));
  const name = (p) => SRC[p]?.name || p;
  const logo = (p) => `<img class="logo" src="${esc(SRC[p]?.icon || `logo/${p}.png`)}" alt="">`;
  const now = new Date();
  const day = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "America/New_York" });
  const time = now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
  const etParts = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", hour12: false })
    .formatToParts(now).map((x) => [x.type, x.value]));
  const weekend = etParts.weekday === "Sat" || etParts.weekday === "Sun", hr = Number(etParts.hour);
  const asOf = weekend ? "at Friday’s close" : hr >= 16 ? "at the close" : hr < 10 ? "at yesterday’s close" : `as of ${time} ET`;

  // ---- which stories: skip anything already posted today (2+ shared key words = same story)
  const key = (st) => st.terms.map((t) => t.toLowerCase());
  const skipped = (opt.get("skip") || "").split("|").filter(Boolean).map((k) => k.split(","));
  const fresh = news.trending.filter((st) => !skipped.some((k) => key(st).filter((t) => k.includes(t)).length >= 2));
  const pool = fresh.length >= 2 ? fresh : news.trending;
  const [a, b] = pool;
  // the cover story: of the top three, the one whose outlets worded it most differently (usually the most gripping)
  const words = (t) => new Set(t.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter((w) => w.length > 3));
  const spread = (st) => {
    const ws = st.angles.slice(0, 4).map((x) => words(x.title));
    let sim = 0, n = 0;
    for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++) {
      const inter = [...ws[i]].filter((w) => ws[j].has(w)).length;
      sim += inter / (new Set([...ws[i], ...ws[j]]).size || 1); n++;
    }
    return 1 - sim / (n || 1);
  };
  const hookStory = pool.slice(0, 3).filter((st) => st.angles.length >= 3).sort((x, y) => spread(y) - spread(x))[0];
  const hookPubs = new Set((hookStory?.angles || []).slice(0, 4).map((x) => x.pub));

  // ---- shared pieces
  let TOTAL = 0, n = 0;
  const top = `<div class="top"><span class="brand">Wallflower</span><span class="date">${esc(day)}</span></div>`;
  const foot = () => `<div class="foot"><span>Every angle, side by side · <b>wallflower.news</b></span><span>${++n} / <i class="total"></i></span></div>`;
  const POPPY = `<div class="poppy" aria-hidden="true"></div>`;   // the first slide gets the header poppy, our signature
  const STEMS = [
    `<img class="peek" src="stem.png" style="height:600px; right:-160px; top:-140px; transform:rotate(-14deg)">`,
    `<img class="peek" src="stem-c.png" style="height:640px; right:-200px; top:-170px; transform:rotate(18deg) scaleX(-1)">`,
    `<img class="peek" src="stem-b.png" style="height:600px; right:-140px; top:-150px; transform:rotate(-22deg)">`,
  ];
  const ALTS = [];
  const num = () => String(n + 1).padStart(2, "0");

  // the hook slide: one story, its outlets' own headlines side by side
  const hook = (st) => {
    const angles = st.angles.slice(0, 4);
    ALTS.push(`${angles.length} headlines for one story: ${angles.map((x) => `${name(x.pub)}: “${x.title}”`).join("; ")}`);
    return `
    <section class="slide hook">
      ${POPPY}${top}
      <div class="eyebrow"><span class="num">${num()}</span>Same story, ${st.pub_count} publications</div>
      <h2 class="hook-title">One story.<br>${["", "", "Two", "Three", "Four"][angles.length]} headlines.</h2>
      <div class="quotes">${angles.map((x) => `
        <div class="quote"><span class="pub">${logo(x.pub)}${esc(name(x.pub))}</span><p>“${esc(x.title)}”</p></div>`).join("")}
      </div>
      ${foot()}
    </section>`;
  };

  const story = (st, label, tint, flower) => {
    const rest = st.angles.filter((x) => x.title.trim() !== st.headline.trim());   // the headline itself is already big above
    ALTS.push(`${label}: ${st.headline}. Covered by ${st.pub_count} publications.`);
    return `
    <section class="slide">
      ${flower}${top}
      <div class="eyebrow"><span class="num">${num()}</span>${label}</div>
      <h1>${esc(st.headline)}</h1>
      ${st.summary ? `<p class="summary">${esc(st.summary)}</p>` : ""}
      <div class="meta"><span class="stack">${st.angles.slice(0, 7).map((x) => logo(x.pub)).join("")}</span>Covered by ${st.pub_count} publications</div>
      ${rest.length >= 2 ? `
      <div class="coverage" style="background:${tint}">
        <div class="cov-label">How it’s covered</div>
        ${rest.slice(0, 4).map((x) => `
          <div class="angle"><span class="pub">${logo(x.pub)}${esc(name(x.pub))}</span><span class="angle-title">${esc(x.title)}</span></div>`).join("")}
      </div>` : ""}
      ${foot()}
    </section>`;
  };

  const fmt = (v) => (v == null ? "—" : v.toLocaleString("en-US", { minimumFractionDigits: v >= 1000 ? 0 : 2, maximumFractionDigits: v >= 1000 ? 0 : 2 }));
  const pct = (p) => (p == null ? "" : `${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(2)}%`);
  const dir = (p) => ((p ?? 0) >= 0 ? "up" : "down");
  function spark(vals, prev, cls) {
    if (!vals?.length) return "";
    const lo = Math.min(...vals, prev ?? Infinity), hi = Math.max(...vals, prev ?? -Infinity), span = hi - lo || 1;
    const y = (v) => 54 - ((v - lo) / span) * 50;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * 400},${y(v).toFixed(1)}`).join(" ");
    const base = prev != null ? `<line x1="0" x2="400" y1="${y(prev)}" y2="${y(prev)}" stroke="#d8d2c6" stroke-width="2" stroke-dasharray="4 6"/>` : "";
    return `<svg viewBox="0 0 400 58" preserveAspectRatio="none">${base}<polyline points="${pts}" fill="none" stroke="var(--${cls})" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
  }
  const q = Object.fromEntries((mkt?.quotes || []).map((m) => [m.name, m]));
  const tiles = ["S&P 500", "Dow", "Nasdaq", "Bitcoin"].map((k) => q[k]).filter(Boolean);
  const sp = q["S&P 500"]?.pct ?? 0;
  const mood = sp <= -1.5 ? "A rough day for stocks" : sp <= -.3 ? "Stocks slip" : sp < .3 ? "Stocks hold steady" : sp < 1.5 ? "Stocks edge up" : "Stocks rally";
  const movers = (list, k = 3) => (list || []).slice(0, k).map((m) => `
    <div class="mv-row"><span class="mv-sym">${esc(m.symbol)}</span><span class="mv-name">${esc(m.name)}</span><span class="mv-pct ${dir(m.pct)}">${pct(m.pct)}</span></div>`).join("");
  const markets = () => {
    ALTS.push(`Markets: ${mood}. ${tiles.map((m) => `${m.name} ${fmt(m.price)}, ${m.pct >= 0 ? "up" : "down"} ${Math.abs(m.pct).toFixed(2)}%`).join("; ")}.`);
    return `
    <section class="slide">
      ${STEMS[1]}${top}
      <div class="eyebrow"><span class="num">${num()}</span>Markets & money</div>
      <h2 class="m-title">${mood}</h2>
      <p class="m-dek">S&P 500 <span class="${dir(sp)}">${pct(sp)}</span> ${esc(asOf)}</p>
      <div class="tiles">${tiles.map((m) => `
        <div class="tile">
          <div class="t-name">${esc(m.name)}</div>
          <div class="t-row"><span class="t-px">${fmt(m.price)}</span><span class="t-ch ${dir(m.pct)}">${pct(m.pct)}</span></div>
          ${spark(m.spark, m.prev, dir(m.pct))}
        </div>`).join("")}
      </div>
      <div class="movers">
        <div class="mv" style="background:var(--pistachio)"><h3>Biggest gainers</h3>${movers(mkt?.movers?.day_gainers)}</div>
        <div class="mv" style="background:var(--blush, #f6e2da)"><h3>Biggest decliners</h3>${movers(mkt?.movers?.day_losers)}</div>
      </div>
      ${foot()}
    </section>`;
  };

  // Sunday: the week's cover stories, one per day (data/top_stories.json, kept by server.py)
  const etDate = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(d);
  const week = [...Array(7)].map((_, i) => etDate(new Date(now - (6 - i) * 864e5))).map((d) => ({ d, ...tops[d] })).filter((x) => x.headline);
  const recap = () => {
    ALTS.push(`The week in cover stories: ${week.map((x) => `${new Date(`${x.d}T12:00`).toLocaleDateString("en-US", { weekday: "long" })}: ${x.headline}`).join("; ")}`);
    return `
    <section class="slide week">
      ${POPPY}${top}
      <div class="eyebrow"><span class="num">${num()}</span>Back Issues</div>
      <h2 class="hook-title">The week in<br>cover stories</h2>
      <div class="days">${week.map((x) => `
        <div class="day-row"><span class="dow">${new Date(`${x.d}T12:00`).toLocaleDateString("en-US", { weekday: "short" })}</span>
          <span class="dh">${esc(x.headline)}</span><span class="dn">${x.pub_count}</span></div>`).join("")}
      </div>
      ${foot()}
    </section>`;
  };

  // ---- assemble
  const mode = opt.get("mode") === "week" && week.length >= 4 ? "week" : "day";
  let html, used;
  if (mode === "week") {
    html = recap() + story(a, "Top story today", "var(--sky)", STEMS[0]);
    used = [a];
  } else {
    // lead with the hook story as the cover (poppy), then the other top story, then markets
    const order = [...new Set([hookStory, a, b].filter(Boolean))].slice(0, 2);
    html = order.map((st, i) =>
      story(st, i ? "Also trending" : "Top story", i ? "var(--butter)" : "var(--sky)", i ? STEMS[2] : POPPY)).join("")
      + (weekend ? "" : markets());
    used = order;
  }
  document.getElementById("slides").innerHTML = html;
  TOTAL = n;
  document.querySelectorAll(".total").forEach((t) => (t.outerHTML = String(TOTAL)));

  // caption: hashtags for each story's key words (Instagram search reads captions) rather than repeating the headlines
  const NOT_TAGS = new Set("One Two Three Four Five Six Seven Eight Nine Ten Dozens Hundreds Thousands Millions How Why What When Who Where Here After Before New Live Watch".split(" "));
  const tags = used.flatMap((st) => st.terms.filter((t) => /^\p{Lu}/u.test(t) && !NOT_TAGS.has(t))
    .sort((x, y) => st.headline.indexOf(x) - st.headline.indexOf(y)).slice(0, 3));
  const lead = mode === "week" ? "The week in cover stories: the headline most outlets ran with, every day."
    : `${day}: what everyone is covering${weekend ? "" : ", plus markets"}.`;
  window.IG = {
    mode, alts: ALTS, keys: used.map((st) => key(st).join(",")),
    caption: [lead, "", "Every angle, side by side, from 24 newsrooms. Read more at wallflower.news (link in bio).", "",
      [...new Set(tags.map((t) => "#" + t.replace(/[^\p{L}\p{N}]/gu, "")))].concat(["#news", "#headlines"]).join(" ")].join("\n"),
  };
  window.CAPTION = window.IG.caption;

  await document.fonts.ready;
  // headlines shrink until they fit 4 lines; summaries lose words until they fit 3
  const lines = (el) => Math.round(el.scrollHeight / parseFloat(getComputedStyle(el).lineHeight));
  document.querySelectorAll("h1").forEach((h) => { let f = 74; while (lines(h) > 4 && f > 48) h.style.fontSize = `${(f -= 2)}px`; });
  document.querySelectorAll(".summary").forEach((p) => {
    const w = p.textContent.split(" ");
    while (lines(p) > 3 && w.length > 5) { w.pop(); p.textContent = w.join(" ").replace(/[,;:.]?$/, "…"); }
  });
  // then make each slide fit: drop extra rows (keep 2), shrink the type, then trim the summary
  const over = (sl) => sl.scrollHeight > sl.clientHeight + 1;
  document.querySelectorAll(".slide").forEach((sl) => {
    const h = sl.querySelector("h1"), p = sl.querySelector(".summary");
    const rows = [...sl.querySelectorAll(".angle, .quote, .day-row")];
    const type = [...sl.querySelectorAll(".quote p, .dh")];
    let t = type.length ? parseFloat(getComputedStyle(type[0]).fontSize) : 0;
    while (type.length && over(sl) && t > 28) { t -= 1; type.forEach((x) => (x.style.fontSize = `${t}px`)); }
    const isWeek = sl.classList.contains("week");   // the recap drops its oldest days; others drop their last rows
    while (over(sl) && rows.length > (isWeek ? 4 : 2)) (isWeek ? rows.shift() : rows.pop()).remove();
    let f = parseFloat(h?.style.fontSize) || 74;
    while (h && over(sl) && f > 52) h.style.fontSize = `${(f -= 2)}px`;
    if (p) { const w = p.textContent.split(" "); while (over(sl) && w.length > 5) { w.pop(); p.textContent = w.join(" ").replace(/[,;:.…]?$/, "…"); } }
  });
  await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
  document.body.dataset.ready = "1";
})();
</script></body></html>
